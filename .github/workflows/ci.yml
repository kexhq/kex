name: CI

# `push` is main ONLY. With `branches: ["**"]` on both events, every branch
# with an open pull request ran the whole suite twice — once for the branch
# tip, once for the pull request — which is what a PR showing 9 checks, four
# of them the same four jobs a second time, was. The pull_request run tests
# the MERGE of the branch into main, which is strictly the more relevant of
# the two, so dropping the push half costs no coverage. What remains on main
# is the post-merge signal: proof that what actually landed is green.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# One run per branch. Pushing a fixup while the previous run is still going
# cancels that one instead of queueing behind it — the older run is testing a
# commit nobody will merge.
#
# On main the group is keyed by SHA instead, which puts every main commit in a
# group of its own. Two things follow, and both are wanted: nothing is ever
# cancelled there — a post-merge run is the record for a commit that has
# already landed, and cancelling it would leave that commit with no verdict —
# and, because the groups differ, two merges in quick succession still run at
# the same time. Keying main on the ref like everything else would serialize
# them, which is not a safety property, just a slower answer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which files this run is about. The compiler suites cannot be affected by
  # an editors/ change, and neither editor's files can be affected by anything
  # outside editors/, so both sides filter on one file list. Workflow-level
  # `paths:` would be the wrong tool: it skips the ENTIRE workflow, taking the
  # editor checks — the ones an editors-only change needs — down with the
  # suites it does not.
  changes:
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.filter.outputs.vscode }}
      vim: ${{ steps.filter.outputs.vim }}
      extension-only: ${{ steps.filter.outputs.extension-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed files
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            # After a force push (or on the very first push) `before` is all
            # zeros and names no commit; fall back to the parent, which at
            # worst runs jobs this commit did not strictly need.
            git rev-parse -q --verify "${base}^{commit}" >/dev/null 2>&1 || base=HEAD^
          fi
          changed=$(git diff --name-only "${base}...HEAD")
          vscode=false
          vim=false
          extension_only=true
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in
              editors/vscode/*) vscode=true ;;
              editors/vim/*) vim=true ;;
              # Anything else under editors/ belongs to neither in
              # particular, so it goes to both rather than to nothing.
              editors/*) vscode=true; vim=true ;;
              *) extension_only=false ;;
            esac
          done <<< "${changed}"
          # An empty diff (nothing distinguishable) says nothing, so err on
          # the side of running the suites.
          [ -n "${changed}" ] || extension_only=false
          echo "vscode=${vscode}" >> "$GITHUB_OUTPUT"
          echo "vim=${vim}" >> "$GITHUB_OUTPUT"
          echo "extension-only=${extension_only}" >> "$GITHUB_OUTPUT"

  # The VS Code extension: same install/compile/package path the release
  # walks locally via `bun run package` (editors/vscode/package.json), split
  # into steps so a type error is not buried under vsce's output. Gated on
  # editors/ changes because nothing else feeds into it.
  extension:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the packageManager field's version so CI compiles with the
      # bun the lockfile was written for.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: editors/vscode

      - name: Typecheck and build
        run: bun run compile
        working-directory: editors/vscode

      # Resolution: which compiler the language server runs, given settings, a
      # Tey home and a package's lock file. Pure enough to test without an
      # editor, and the half where a wrong answer is silent — the extension
      # still works, just against the wrong Kex.
      - name: Unit tests
        run: bun run test
        working-directory: editors/vscode

      # The lifecycle: starting, restarting after the compiler is rebuilt or
      # killed, and the toolchain picker. None of that can be checked without
      # a real VS Code, so this downloads one and drives it. The compiler is a
      # stub (test/fixtures/kex-stub.mjs), so no Kex is built here and nothing
      # depends on what the runner has installed. Xvfb because VS Code is a
      # GUI application even when nobody is looking.
      - name: Integration tests
        run: xvfb-run -a bun run test:integration
        working-directory: editors/vscode

      # Producing the .vsix validates the rest of packaging: manifest
      # fields, the `files` list, README/LICENSE inclusion.
      - name: Package the .vsix
        run: bunx --bun @vscode/vsce package --no-dependencies
        working-directory: editors/vscode

  # The Vim/Neovim runtime files: editors/vim/test/run.vim reindents a
  # fixture written the way `=` should leave it, fails on any line that moved,
  # and checks the syntax group a dozen constructs land in. Run under both
  # editors because the files target both and the two are not the same
  # program — Vim never sources the .lua half, and its regexp and syntax
  # engines are separate implementations from Neovim's.
  vim-runtime:
    needs: changes
    if: needs.changes.outputs.vim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim and Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim neovim

      # Both invocations exit nonzero on failure and name what moved where.
      - name: Neovim
        run: nvim --headless -u editors/vim/test/run.vim

      # `-es` reads commands from stdin; without the redirect Vim waits on a
      # terminal that CI does not have.
      - name: Vim
        run: vim -es -u NONE -N -c 'source editors/vim/test/run.vim' < /dev/null

  # Both platforms, because they genuinely disagree. libm is only required to
  # correctly round some operations (sqrt, the arithmetic operators); for the
  # rest — cbrt among them — macOS and glibc differ in the last bit, and float
  # display prints the shortest text that round-trips, so such a difference
  # reaches the golden files. Linux-only CI meant a macOS-passing spec could
  # still break on push (and vice versa), with nothing local able to catch it.
  test:
    needs: changes
    if: needs.changes.outputs.extension-only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than cancelling the sibling on the first
      # failure: when they diverge, the interesting information is precisely
      # which one differs and how.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libreadline-dev erlang-base libboost-context-dev

      # cmake ships with the macOS runner image. No OpenSSL here: CMakeLists
      # uses CommonCrypto for SHA-256 on Apple. PCRE2 is explicit because,
      # unlike the Linux image, it is not preinstalled.
      #
      # Unversioned erlang, matching release.yml: Kex targets current OTP and
      # does not support back-loading its runtime beams into an older one.
      # kex diagnoses that mismatch at startup (the runtime-version guard in
      # main.cxx) instead of CI compiling down to an ancient floor for it.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp pcre2 boost erlang readline

      # KEX_BOOST_STATIC matches release.yml: the released archives link
      # Boost.Context statically (see CMakeLists.txt), and a static link that
      # only ever happens during a release is a link nobody finds out about
      # until the release is the thing that breaks.
      - name: Build
        run: cmake -B build -G "Unix Makefiles" -DKEX_BOOST_STATIC=ON && cmake --build build --parallel

      - name: Unit tests
        run: make test

      - name: Spec suite
        run: make spec

      - name: Prelude spec suite
        run: make spec-prelude

      - name: Stdlib spec suite
        run: make spec-stdlib

      # The two backends are expected to agree on every spec, so a difference
      # fails the build. Known representation-level gaps (pid rendering, a
      # Range printing as its item list) are outside these suites by design.
      - name: Spec suite via BEAM
        run: make spec-beam

      - name: Prelude spec suite via BEAM
        run: make spec-prelude-beam

      - name: Stdlib spec suite via BEAM
        run: make spec-stdlib-beam

      # The JSON reporting an editor's test tree reads, on both backends
      # (kexhq/kex#199). Same reasoning as the suites above: the records are a
      # contract, and a tool cannot care which backend ran the suite.
      - name: Test-reporting modes
        run: make spec-test-json

  # musl is a supported platform, and glibc passing says nothing about it:
  # the spec suite pins float formatting, and that is exactly where libm
  # implementations differ. The image build runs `make spec` and
  # `make spec-beam` inside Alpine, so this job is both the platform test and
  # the artifact the release publishes.
  alpine:
    needs: changes
    if: needs.changes.outputs.extension-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Alpine image (runs the suites on musl)
        run: docker build -f docker/Dockerfile.alpine --build-arg BUILD_JOBS=4 -t kex:alpine .

      - name: Smoke-test both backends in the image
        run: |
          set -euo pipefail
          printf 'main do\n  IO.printLine("ok")\nend\n' > /tmp/smoke.kex
          docker run --rm kex:alpine --version
          [ "$(docker run --rm -v /tmp:/work kex:alpine smoke.kex)" = "ok" ]
          [ "$(docker run --rm -v /tmp:/work kex:alpine -R smoke.kex)" = "ok" ]

      # Tey ships in the image too, and that is the whole reason a CI system
      # without a GitHub Action can use it. Three things can break and none
      # would show up above: Tey missing, `kex` resolving to Tey's dispatcher
      # instead of the compiler, or TEY_KEX unset so Tey tries to DOWNLOAD a
      # toolchain from inside a container that already has one.
      - name: Smoke-test Tey in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint tey kex:alpine --version
          # `kex` must be the compiler. Tey's dispatcher answers --version too,
          # so compare the path rather than trusting the output.
          [ "$(docker run --rm --entrypoint sh kex:alpine -c 'command -v kex')" = "/opt/kex/bin/kex" ]
          docker run --rm --entrypoint sh kex:alpine -c '
            set -eu
            cd /tmp && tey new smoke --lib >/dev/null
            cd smoke && tey build >/dev/null && tey test'

      # The slim image keeps the BEAM and drops the OTP applications Kex does
      # not use, so what needs checking is that the remaining set is enough:
      # its own build runs the suites against the pruned distribution, and
      # this confirms the published layer behaves the same.
      - name: Build and smoke-test the slim image
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.slim --build-arg BUILD_JOBS=4 -t kex:slim .
          [ "$(docker run --rm -v /tmp:/work kex:slim smoke.kex)" = "ok" ]
          [ "$(docker run --rm -v /tmp:/work kex:slim -R smoke.kex)" = "ok" ]

  # Tey, which nothing in CI used to touch. It is written in Kex and lives in
  # this repository, so a compiler change can break it — and until this job
  # existed the first thing to compile it was `make -C tey install` inside
  # release.yml, which meant a Tey that did not build stopped a RELEASE rather
  # than a pull request. Its own suites run here too.
  tey:
    needs: changes
    if: needs.changes.outputs.extension-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # erlang for erlc: Tey is compiled to .beam, and its suites run through
      # the BEAM backend because that is how Tey itself runs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libpcre2-dev libreadline-dev \
            libssl-dev erlang-base libboost-context-dev

      - name: Build kex
        run: cmake -B build -G "Unix Makefiles" -DKEX_BOOST_STATIC=ON && cmake --build build --parallel

      # Compiling Tey is the first assertion: it either builds with this
      # compiler or it does not.
      - name: Build Tey
        run: make build-tey

      - name: Tey spec suite
        run: make spec-tey

      # The suites cover the pure logic; this covers the wiring — that the
      # launcher starts, finds its modules, and answers. A Tey whose .beam
      # files cannot be loaded passes every spec above and is still broken.
      - name: Smoke-test the tey CLI
        run: |
          set -euo pipefail
          make -C tey install PREFIX="$(pwd)/stage" KEX="$(pwd)/build/kex" ERL=erl INSTALL_NONINTERACTIVE=1
          export TEY_HOME="$(mktemp -d)"
          stage/bin/tey --version
          stage/bin/tey --help > /dev/null
          # The offline JSON listing an editor's toolchain picker reads
          # (kexhq/kex#160): valid JSON, an empty toolchains array, exit 0.
          stage/bin/tey kex list --installed --json | python3 -m json.tool > /dev/null
          # --json without --installed would reach the network, so it must be
          # refused rather than half-answered.
          if stage/bin/tey kex list --json; then
            echo "::error::tey kex list --json should refuse without --installed"
            exit 1
          fi
          # Nothing installed and nothing bundled, so `latest` has nothing to
          # resolve to and the command must fail rather than invent a version.
          if stage/bin/tey kex use latest; then
            echo "::error::tey kex use latest should fail when no Kex is installed"
            exit 1
          fi

  wasm:
    needs: changes
    if: needs.changes.outputs.extension-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # erlang-base and libgmp-dev are for the NATIVE build below, not for
      # the wasm one: the compiled stdlib unit the wasm checker reads can only
      # be produced by running the native kex through erlc.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libreadline-dev \
            erlang-base libboost-context-dev

      # Pinned to 5.0.7 specifically — newer Emscripten (6.0.2 at the time
      # this was found) has a real regression where -sASYNCIFY combined with
      # -sNO_DISABLE_EXCEPTION_CATCHING hangs on the first
      # emscripten_fiber_swap call. See third_party/gmp-wasm/README.md's
      # "Emscripten version" section for the full writeup.
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-5.0.7

      - name: Install emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 5.0.7 && ./emsdk activate 5.0.7

      # Each Actions `run` step starts a fresh shell. Sourcing emsdk_env.sh
      # while building GMP/configuring CMake therefore does not make emcmake
      # available to the later `make test-wasm` and `make spec-wasm` steps.
      # Activate on cache hits too, then persist the tool directories through
      # GITHUB_PATH for every remaining step in this job.
      - name: Activate emsdk
        run: |
          ./emsdk/emsdk activate 5.0.7
          echo "${GITHUB_WORKSPACE}/emsdk" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "${GITHUB_PATH}"

      # GMP built for wasm32 from source — no prebuilt wasm GMP exists via
      # Emscripten's port system or Homebrew, and third_party/gmp-wasm's
      # include/lib are gitignored (build artifacts, not vendored — see that
      # directory's README.md and CLAUDE.md's stance on not committing
      # generated binaries). Cached here since the build itself takes a
      # couple of minutes and never changes unless the GMP or Emscripten
      # version pin above changes.
      - name: Cache GMP-for-wasm
        id: cache-gmp-wasm
        uses: actions/cache@v4
        with:
          path: |
            third_party/gmp-wasm/include
            third_party/gmp-wasm/lib
          key: gmp-wasm-6.3.0-emsdk-5.0.7-v2

      - name: Build GMP for wasm
        if: steps.cache-gmp-wasm.outputs.cache-hit != 'true'
        run: |
          source emsdk/emsdk_env.sh
          # gmplib.org itself timed out connecting from GitHub's runners
          # (confirmed: curl hung ~135s then failed) — ftp.gnu.org mirrors
          # the same release and is far better CDN'd for CI traffic.
          curl -LO https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xf gmp-6.3.0.tar.xz
          mkdir gmp-6.3.0/build-wasm && cd gmp-6.3.0/build-wasm
          emconfigure ../configure \
            --host=wasm32-unknown-emscripten \
            --build="$(../config.guess)" \
            --disable-assembly \
            --disable-shared \
            --enable-static \
            --enable-cxx \
            --prefix="${GITHUB_WORKSPACE}/third_party/gmp-wasm" \
            CC_FOR_BUILD=clang \
            CFLAGS="-O2"
          emmake make -j"$(nproc)"
          emmake make install

      # PCRE2 for wasm32, backing the Regex module in the wasm build. Same
      # arrangement as GMP above: no Emscripten port exists, and
      # third_party/pcre2-wasm's include/lib are gitignored build output (see
      # that directory's README.md). Cheap to build compared to GMP, but
      # cached on the same terms since it never changes unless the version
      # pin does.
      - name: Cache PCRE2-for-wasm
        id: cache-pcre2-wasm
        uses: actions/cache@v4
        with:
          path: |
            third_party/pcre2-wasm/include
            third_party/pcre2-wasm/lib
          key: pcre2-wasm-10.44-emsdk-5.0.7-v1

      - name: Build PCRE2 for wasm
        if: steps.cache-pcre2-wasm.outputs.cache-hit != 'true'
        run: |
          source emsdk/emsdk_env.sh
          curl -LO https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
          tar xf pcre2-10.44.tar.gz
          mkdir pcre2-10.44/build-wasm && cd pcre2-10.44/build-wasm
          # --disable-pcre2-jit: the JIT emits native machine code, which does
          # not exist for wasm. --enable-unicode: regex.cxx compiles patterns
          # with PCRE2_UTF/PCRE2_UCP, which need it.
          emconfigure ../configure \
            --host=wasm32-unknown-emscripten \
            --build="$(../config.guess)" \
            --disable-shared \
            --enable-static \
            --disable-pcre2-jit \
            --enable-unicode \
            --prefix="${GITHUB_WORKSPACE}/third_party/pcre2-wasm" \
            CFLAGS="-O2"
          emmake make -j"$(nproc)"
          emmake make install

      # Produces build/runtime/beam/kex_prelude.beam plus its Kex.* companions.
      # The wasm build reads their KexI metadata so its type checker sees the
      # same signatures the native one does; nothing here is executed by wasm.
      - name: Build native kex (for the compiled stdlib unit)
        run: |
          cmake -B build -G "Unix Makefiles"
          cmake --build build --target kex_prelude_beam --parallel

      - name: Configure and build wasm target
        run: |
          source emsdk/emsdk_env.sh
          make build-wasm

      - name: Wasm unit tests (via Node)
        run: make test-wasm

      # NODERAWFS (see CMakeLists.txt's kex target) gives the wasm-built
      # CLI real host filesystem access via Node, so the full spec suite
      # can run against it directly — same tree-walker as native, so this
      # is expected to match closely (unlike spec-beam, this one DOES gate
      # CI: a wasm-specific spec mismatch would be a real regression, not a
      # documented backend gap).
      - name: Spec suite via wasm (Node)
        run: make spec-wasm
