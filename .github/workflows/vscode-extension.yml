name: VS Code extension

# The editor extension is released deliberately, by hand: bump "version" in
# editors/vscode/package.json, merge it, then run this workflow from the
# Actions tab. Merging alone publishes nothing — an editor release is a
# decision, not a side effect of touching editors/vscode. Its number is its
# own — extension-facing changes, not compiler releases — so it deliberately
# has no hook in release.yml: a compiler release must not republish the
# extension, and an extension release must not tag the compiler.
#
# Marketplace versions are immutable, so the run first asks the gallery
# whether this version already exists and skips instead of failing when it
# does (same contract as release.yml's npm job) — a re-run without a version
# bump is cheap: it exits with "already published".
#
# Pre-release is a property stamped on a version, not a different kind of
# number: the Marketplace has no place for a suffix (it refuses 0.1.0-alpha.1
# by name), so both channels draw from one ascending major.minor.patch
# sequence.
#
# Which channel a run publishes is the `prerelease` INPUT and nothing else.
# It used to be inferred from the minor number's parity — odd pre-release,
# even stable, Microsoft's convention — with the input only able to override
# in one direction. That inference is gone: it made the channel a property of
# a number edited in another commit, so the person dispatching the workflow
# could not see what they were about to publish, and asking for stable on an
# odd minor was refused rather than obeyed. The checkbox on the dispatch form
# is now the whole answer.
#
# Parity remains a good habit for choosing the next number — reserving odd
# minors for pre-releases keeps one from burning a number the next stable
# wants — but it is a convention for humans picking a version, not a rule the
# workflow enforces.
#
# The VS Code Marketplace is the only store this publishes to. Open VSX
# (VSCodium, Cursor) has no account yet, so those users install the .vsix by
# hand until one exists.
#
# Secrets:
#   VSCE_PAT  required — Azure DevOps PAT, Marketplace/Manage scope, created
#             under the Kex publisher's organization.

# Platform-specific VSIXs, on purpose: the extension spawns `kex --lsp` from
# PATH, and Kex does not build or ship on Windows yet. Packaging with
# --target stamps TargetPlatform into the VSIX, and the Marketplace then
# refuses installation everywhere else — so a Windows user cannot install a
# broken extension at all, rather than installing one that errors on first
# use. Every supported platform gets its own package: linux, alpine (musl is
# a supported Kex platform), darwin, both architectures each. Publishing a
# --packagePath VSIX reads its target from its manifest, so no --target is
# needed at publish time.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        # Defaulting ON because the two mistakes are not equal: Marketplace
        # versions are immutable, so publishing stable when a pre-release was
        # meant is served to everyone and cannot be taken back, while the
        # reverse is only seen by people who opted in and is fixed by
        # publishing the next number. Unticking it is the deliberate act.
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads "packageManager": "bun@1.3.13" from editors/vscode/package.json,
      # so the CI build uses the same bun the local `bun run package` does.
      - uses: oven-sh/setup-bun@v2
        with:
          repository: editors/vscode

      - name: Read the extension version
        id: version
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log(require("./package.json").version)')

          # major.minor.patch, nothing else. The gallery rejects a semver
          # pre-release suffix outright ("The VS Marketplace doesn't support
          # prerelease versions: '0.1.0-alpha.1'"), and it rejects it at
          # publish — after six VSIXs have been built — so the check belongs
          # here, before any of that work.
          case "$version" in
            *[!0-9.]*|*-*)
              echo "::error::${version} is not a Marketplace version. Use major.minor.patch; the pre-release channel is the workflow's prerelease input, not a suffix."
              exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # The channel is the dispatch input, verbatim. A boolean input
          # arrives as the string "true"/"false", and the `|| false` covers
          # the one case where it arrives as neither: a run triggered by
          # something other than the form, where unset must not read as
          # pre-release by accident.
          prerelease="${{ inputs.prerelease || false }}"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          if [ "$prerelease" = true ]; then
            echo "Publishing ${version} as a PRE-RELEASE."
          else
            echo "Publishing ${version} as STABLE."
          fi

      # The platforms Kex supports — everything but Windows, both libc
      # flavors and both architectures.
      - name: Set the target platforms
        id: targets
        # A plain space-separated list: every consumer below is a shell
        # `for` loop, so this is the form that words correctly. A JSON array
        # would only be right if something read it with fromJSON.
        run: echo "targets=linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64" >> "$GITHUB_OUTPUT"

      # vsce show answers from the gallery with the PAT; --json yields a
      # versions array, and membership there means this number is already
      # somebody's installed extension — not to be rebuilt.
      - name: Check whether the version is already published
        id: check
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if bunx --bun vsce show Kex.kex-language --json 2>/dev/null \
             | jq -e --arg v "$version" '[.versions[].version] | index($v) != null' >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Kex.kex-language@${version} is already on the Marketplace; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        working-directory: editors/vscode
        run: bun install --frozen-lockfile

      # The repo's own pipeline — tsc, bun build — once, then one targeted
      # vsce package per platform (the stamped TargetPlatform is what keeps
      # the extension off Windows). --pre-release must be given at package
      # time (it stamps a Microsoft.VisualStudio.Code.PreRelease property
      # into the VSIX) or `vsce publish --pre-release` will refuse it.
      - name: Package
        if: steps.check.outputs.published == 'false'
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          flag=""
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then flag="--pre-release"; fi
          bun run compile
          version="${{ steps.version.outputs.version }}"
          for target in ${{ steps.targets.outputs.targets }}; do
            bunx --bun vsce package --no-dependencies $flag \
              --target "$target" --out "kex-language-${version}-${target}.vsix"
          done

      # Publishing the packaged .vsix files (--packagePath) rather than letting
      # publish repackage: the store receives the identical bytes this workflow
      # tested, target stamped at package time.
      #
      # A rejection here can be about the extension's NAME rather than its
      # contents: the Marketplace refuses a `displayName` it considers close to
      # an existing one, and "Kex Language Support" was refused against the
      # field of "<Something> Language Support" extensions. Hence the bare
      # "Kex" in package.json — the description carries what the suffix used
      # to say. The check runs on every publish, so renaming it back reopens
      # this.
      - name: Publish to the Marketplace
        if: steps.check.outputs.published == 'false'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          flag=""
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then flag="--pre-release"; fi
          version="${{ steps.version.outputs.version }}"
          for target in ${{ steps.targets.outputs.targets }}; do
            bunx --bun vsce publish --no-dependencies $flag --packagePath "kex-language-${version}-${target}.vsix"
          done
