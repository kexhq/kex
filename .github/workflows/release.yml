name: Release

# Releasing is ONE action: run this workflow. It reads the VERSION file, builds
# that version, tags it and publishes it.
#
# The version itself is NOT decided here. VERSION always names the NEXT
# release — the version the tree is working toward, not the last one shipped —
# and this workflow releases exactly what it finds there. Bumping it is an
# ordinary reviewed commit, so the version is a decision in the repository's
# history rather than a form field, and the diff that raises it is the diff
# that says why.
#
# That convention is what makes the tag check below meaningful: if VERSION
# still names something already released, the tree has not decided what comes
# next, and the run stops instead of guessing.
#
# Nothing is triggered by pushing a tag either, because a tag is an OUTPUT of a
# release, not the request for one: a hand-pushed tag can land on a commit
# whose suites never ran, and cannot be taken back once somebody has fetched
# it. Here the tag is created by the LAST job, so a tag in this repository
# always names a version that was actually published.
#
# The channel comes from VERSION's pre-release identifier, which must be one of
# prealpha, alpha, beta, rc, each optionally followed by .N:
#
#   0.4.0        stable       moves `latest`, updates the Homebrew tap, and is
#                             what /releases/latest, kex.run and a bare
#                             `tey kex install` hand out; on npm it is
#                             @kexhq/kex's `latest` dist-tag
#   0.4.0-rc.1   pre-release  published, tagged `:rc`, reachable by name only;
#                             on npm under the channel dist-tag (`rc`)
#
# The npm package is built and published here too, with VERSION as its version
# number — every channel answers "which Kex is this?" with the same number.
# CI covers the dev side: every push publishes <VERSION>-dev.<sha> under the
# floating `next` dist-tag (see ci.yml's wasm job).
#
# docs/releasing.md is the maintainer's runbook: how to run one, what each job
# publishes, and what to do when a job fails.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to release; its VERSION file is the version"
        default: main
      bump_after:
        description: "After publishing, open a PR raising VERSION to the next one"
        type: choice
        default: "pull request"
        options: ["pull request", "nothing"]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the version and hands every job below one commit to build.
  # Everything expensive is downstream of this, so a mistake costs seconds.
  version:
    runs-on: ubuntu-latest
    # Releasing is maintainer-only. `workflow_dispatch` is open to anyone with
    # write access, which is a wider circle than the people who should be able
    # to publish a Kex — so the first job runs in an environment whose
    # protection rules (required reviewers) are configured in repository
    # settings, and re-checks the caller's permission below in case the
    # environment is ever left unprotected.
    environment: release
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      sha: ${{ steps.read.outputs.sha }}
      build_date: ${{ steps.read.outputs.build_date }}
      revision: ${{ steps.read.outputs.revision }}
    steps:
      - name: Check that the caller may release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          level=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)
          case "$level" in
            admin|maintain) echo "${GITHUB_ACTOR} may release (${level})" ;;
            *) echo "::error::${GITHUB_ACTOR} has '${level}' permission; releasing needs admin or maintain."
               exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Read the version
        id: read
        run: |
          set -euo pipefail
          # One plain file, so this is a read rather than a parse of C++.
          version=$(tr -d "[:space:]" < VERSION)

          # Only the channels Kex publishes. An unknown identifier is a typo
          # (`-rc-1`, `-RC.1`), and a typo must not become a release.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(prealpha|alpha|beta|rc)(\.[0-9]+)?)?$'; then
            echo "::error::VERSION holds '${version}', which is not a Kex version (MAJOR.MINOR.PATCH[-(prealpha|alpha|beta|rc)[.N]])"
            exit 1
          fi

          tag="v${version}"
          # A released version is never rebuilt: someone may already be running
          # it, and a second build of the same number would not be the same
          # bytes. Bump VERSION and merge that first.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. Bump VERSION on ${{ inputs.ref }} and run again."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=$([ "$version" = "${version%%-*}" ] && echo false || echo true)"
            echo "sha=$(git rev-parse HEAD)"
            echo "revision=$(git rev-parse --short HEAD)"
            # The commit's own date, so the binary's `built` stamp is a fact
            # about the release rather than about when a runner happened to run.
            echo "build_date=$(git show -s --format=%cs HEAD)"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing Kex ${version} from $(git rev-parse --short HEAD)"

  # One archive per platform, each holding the same install tree `make
  # install` produces: bin/kex plus share/kex/{stdlib,runtime,manifest}.
  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          # No macos-x86_64: GitHub has retired its Intel macOS runners, so a
          # macos-13 job queues forever and hangs the whole release. Until the
          # x86_64 build is cross-compiled on an arm64 runner, Intel macOS has
          # no archive — tey's resolver falls back to a source build there.
          # Tracked in docs/releasing.md's "Known gaps".
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Everything is named explicitly, including the two the x86_64 image
      # happens to preinstall: linux-arm64 builds on a DIFFERENT runner image,
      # and "it was already there on the other one" is not a dependency list.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libpcre2-dev libreadline-dev \
            libssl-dev erlang-base libboost-context-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp pcre2 boost erlang readline

      # KEX_BOOST_STATIC is what makes the archive installable by a package
      # manager: see the comment on the option in CMakeLists.txt. It is a
      # release-build setting rather than the default because a distribution
      # packaging Kex from source wants its own shared boost.
      - name: Build
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DKEX_BOOST_STATIC=ON \
            -DKEX_BUILD_DATE="${{ needs.version.outputs.build_date }}"
          cmake --build build --parallel

      # A release is not published on a red suite. These are the same gates CI
      # runs on a branch, which tags do not trigger.
      - name: Unit tests
        run: make test

      - name: Spec suite
        run: make spec

      - name: Prelude spec suite
        run: make spec-prelude

      - name: Stdlib spec suite
        run: make spec-stdlib

      - name: Spec suite via BEAM
        run: make spec-beam

      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="kex-${version}-${target}"
          cmake --install build --prefix "stage/${name}"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C stage "${name}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
          "stage/${name}/bin/kex" --version

      # Tey is compiled to BEAM modules, which are architecture-independent, so
      # ONE archive serves every platform and is built on whichever runner is
      # already here. That is what lets a package manager install Tey without
      # being able to build Kex at all: it unpacks this, and `tey kex install`
      # brings the compiler.
      #
      # Compiled by the oldest Erlang in the matrix on purpose — a .beam cannot
      # be loaded by an older runtime than the one that produced it, so the
      # floor this sets is the floor every user inherits.
      - name: Package Tey
        if: matrix.target == 'linux-x86_64'
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          name="tey-${version}"
          # ERL=erl rather than the runner's absolute path: the launcher only
          # honours a baked path that exists, and an absolute path from a
          # GitHub runner never will on a user's machine.
          make -C tey install PREFIX="$(pwd)/stage/${name}" \
            KEX="$(pwd)/build/kex" ERL=erl INSTALL_NONINTERACTIVE=1
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C stage "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          "stage/${name}/bin/tey" --version

      - uses: actions/upload-artifact@v4
        with:
          name: kex-${{ matrix.target }}
          path: dist/*

  # The npm package (@kexhq/kex), built from the release commit: the same wasm
  # binary CI's wasm job produces, but stamped with the release's VERSION as
  # the package version, so the npm channel reports the same number as every
  # other one. The wasm BINARY already does (CMake bakes VERSION in); this is
  # the package.json half.
  #
  # Built here rather than repackaged from CI's dev tarball for the same
  # reason the native archives are rebuilt: KEX_BUILD_DATE is pinned to the
  # release commit, not to whichever day a runner happened to build it. The
  # suites run again on the pinned commit — a red suite means no release, and
  # the npm package is a release artifact like the archives and images.
  wasm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # The wasm checker reads the COMPILED stdlib unit (kex_prelude.beam and
      # its Kex.* companions), which only the native build can produce: it
      # means running the native kex through erlc, and a cross-compiled build
      # cannot. Same arrangement as ci.yml's wasm job.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libreadline-dev \
            erlang-base libboost-context-dev

      - name: Build native kex (for the compiled stdlib unit)
        run: |
          cmake -B build -G "Unix Makefiles"
          cmake --build build --target kex_prelude_beam --parallel

      # ── The wasm toolchain, identical to ci.yml's wasm job. The cache keys
      # match, so on a release this is a restore, not a rebuild.
      #
      # Pinned to 5.0.7 specifically — newer Emscripten (6.0.2 at the time
      # this was found) has a real Asyncify+exceptions regression; see
      # third_party/gmp-wasm/README.md's "Emscripten version" section.
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-5.0.7

      - name: Install emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 5.0.7 && ./emsdk activate 5.0.7

      # Activate on cache hits too, and persist the tool directories through
      # GITHUB_PATH for every later step in this job.
      - name: Activate emsdk
        run: |
          ./emsdk/emsdk activate 5.0.7
          echo "${GITHUB_WORKSPACE}/emsdk" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "${GITHUB_PATH}"

      - name: Cache GMP-for-wasm
        id: cache-gmp-wasm
        uses: actions/cache@v4
        with:
          path: |
            third_party/gmp-wasm/include
            third_party/gmp-wasm/lib
          key: gmp-wasm-6.3.0-emsdk-5.0.7-v2

      - name: Build GMP for wasm
        if: steps.cache-gmp-wasm.outputs.cache-hit != 'true'
        run: |
          source emsdk/emsdk_env.sh
          curl -LO https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xf gmp-6.3.0.tar.xz
          mkdir gmp-6.3.0/build-wasm && cd gmp-6.3.0/build-wasm
          emconfigure ../configure \
            --host=wasm32-unknown-emscripten \
            --build="$(../config.guess)" \
            --disable-assembly \
            --disable-shared \
            --enable-static \
            --enable-cxx \
            --prefix="${GITHUB_WORKSPACE}/third_party/gmp-wasm" \
            CC_FOR_BUILD=clang \
            CFLAGS="-O2"
          emmake make -j"$(nproc)"
          emmake make install

      - name: Cache PCRE2-for-wasm
        id: cache-pcre2-wasm
        uses: actions/cache@v4
        with:
          path: |
            third_party/pcre2-wasm/include
            third_party/pcre2-wasm/lib
          key: pcre2-wasm-10.44-emsdk-5.0.7-v1

      - name: Build PCRE2 for wasm
        if: steps.cache-pcre2-wasm.outputs.cache-hit != 'true'
        run: |
          source emsdk/emsdk_env.sh
          curl -LO https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
          tar xf pcre2-10.44.tar.gz
          mkdir pcre2-10.44/build-wasm && cd pcre2-10.44/build-wasm
          # --disable-pcre2-jit: no native machine code exists for wasm.
          # --enable-unicode: regex.cxx compiles patterns with PCRE2_UTF/UCP.
          emconfigure ../configure \
            --host=wasm32-unknown-emscripten \
            --build="$(../config.guess)" \
            --disable-shared \
            --enable-static \
            --disable-pcre2-jit \
            --enable-unicode \
            --prefix="${GITHUB_WORKSPACE}/third_party/pcre2-wasm" \
            CFLAGS="-O2"
          emmake make -j"$(nproc)"
          emmake make install

      # `make build-wasm`, spelled out so KEX_BUILD_DATE can be pinned — the
      # Makefile target takes no extra -D flags. The date, the git revision
      # (resolved from the checkout by CMake itself) and VERSION are what
      # `node build-wasm/kex.js --version` reports; a release build states
      # the release, not the day a runner ran.
      - name: Configure and build the wasm target
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -B build-wasm \
            -DKEX_PREBUILT_RUNTIME_DIR="$(pwd)/build/runtime/beam" \
            -DKEX_BUILD_DATE="${{ needs.version.outputs.build_date }}"
          cmake --build build-wasm --parallel
          node build-wasm/kex.js --version

      # The same gates CI's wasm job runs, on the pinned commit. (These
      # re-invoke the Makefile's build-wasm target; CMake keeps the pinned
      # KEX_BUILD_DATE from the cache.)
      - name: Wasm unit tests (via Node)
        run: make test-wasm

      - name: Spec suite via wasm (Node)
        run: make spec-wasm

      # prepack (scripts/build.sh) assembles dist/ from build-wasm — no
      # rebuild, the artifacts are already there. npm pack then produces
      # kexhq-kex-<version>.tgz with VERSION as the package version, set
      # here rather than carried in package.json: the field in the tree is
      # a placeholder, and the number is VERSION's to give, at publish time.
      - name: Pack the npm package
        run: |
          npm version "${{ needs.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          npm pack
        working-directory: packages/kex

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: packages/kex/kexhq-kex-*.tgz

  # The container images, published to GHCR alongside the archives:
  #
  #   ghcr.io/kexhq/kex:<version>              glibc, BEAM included
  #   ghcr.io/kexhq/kex:<version>-alpine       musl, BEAM included
  #   ghcr.io/kexhq/kex:<version>-slim         musl, tree walker only
  #
  # Each architecture is built on a runner of that architecture rather than
  # under QEMU: the image build RUNS the spec suites, and emulating them
  # turns a ten-minute job into an hour while testing the emulator as much as
  # the compiler. The per-arch images are pushed by digest and stitched into
  # one multi-arch tag by the `manifest` job below, so `docker pull` picks the
  # right one automatically.
  image:
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Two dimensions, so this is a 3 x 2 cross product; the `include`
      # entries only attach the file/suffix/runner that each value implies.
      matrix:
        variant: [full, alpine, slim]
        arch: [amd64, arm64]
        include:
          - variant: full
            dockerfile: docker/Dockerfile
            suffix: ""
          - variant: alpine
            dockerfile: docker/Dockerfile.alpine
            suffix: "-alpine"
          - variant: slim
            dockerfile: docker/Dockerfile.slim
            suffix: "-slim"
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            KEX_BUILD_DATE=${{ needs.version.outputs.build_date }}
            KEX_GIT_REVISION=${{ needs.version.outputs.revision }}
            BUILD_JOBS=4
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.variant }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*

  # One tag per variant, pointing at both architectures.
  #
  # `latest` (and `latest-alpine`, `latest-slim`) follow STABLE releases only,
  # so `docker run ghcr.io/kexhq/kex` never hands someone an rc they did not
  # ask for. A pre-release is reachable by its exact version, and by its
  # channel name (`:rc`, `:rc-alpine`) for anyone tracking one.
  #
  # Waits on `build` as well as `image`, because this is the step that makes an
  # image REACHABLE. `image` pushes by digest — untagged blobs nobody can pull
  # by name — while `build` is still running the suites, and the image jobs
  # finish first precisely because they do not run any. Without `build` here, a
  # release whose specs failed still tagged `:<version>` and `:latest`, and
  # `docker run ghcr.io/kexhq/kex` handed it to people, while the `publish` job
  # below correctly refused to create the release the tags belonged to. Costs
  # no wall time: `publish` already waits for `build`, so nothing downstream
  # starts sooner for having tagged early.
  manifest:
    needs: [version, image, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: alpine
            suffix: "-alpine"
          - variant: slim
            suffix: "-slim"
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true

      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          suffix="${{ matrix.suffix }}"
          image="ghcr.io/${{ github.repository }}"

          tags=(--tag "${image}:${version}${suffix}")
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
            tags+=(--tag "${image}:${channel}${suffix}")
          else
            tags+=(--tag "${image}:latest${suffix}")
          fi

          sources=()
          for digest in digests/*; do
            sources+=("${image}@$(cat "$digest")")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${version}${suffix}"

  publish:
    needs: [version, build, manifest, wasm]
    runs-on: ubuntu-latest
    steps:
      # Full history: the release log below is built from the commits since the
      # previous release, and a shallow clone has neither those nor the tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # Only the platform archives. The `image` jobs upload one-line digest
      # artifacts as well, and those are plumbing between jobs, not release
      # assets.
      - uses: actions/download-artifact@v4
        with:
          pattern: kex-*
          path: artifacts

      # The release page is the changelog. There is no CHANGELOG.md to keep in
      # step with the tags — the log is compiled here, from the commits the
      # release actually contains.
      - name: Compile the release log
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail

          # The newest tag that already exists is the previous release, since
          # every tag in this repository is one.
          previous=$(git tag --sort=-v:refname | head -1 || true)

          {
            if [ "${VERSION%%.*}" = "0" ]; then
              echo "> **Kex is before 1.0.0, so no backward compatibility is attempted.**"
              echo "> The language, the standard library, the package format and the on-disk"
              echo "> layouts change between releases without deprecation cycles. Pin a version,"
              echo "> and expect to edit code when you move off it."
              echo
            fi

            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              # Merges are dropped: their subjects repeat the branch names, and
              # the commits they bring are listed on their own.
              git log --no-merges --pretty="- %s (%h)" "${previous}..${SHA}" || true
            else
              echo "- First release."
            fi
            echo

            echo "## Install"
            echo
            echo '```sh'
            echo "tey kex install ${VERSION}"
            echo "docker run ghcr.io/kexhq/kex:${VERSION}"
            echo "npm install @kexhq/kex@${VERSION}   # GitHub Packages - see packages/kex/README.md"
            echo '```'
            echo
            echo "Or download the archive for your machine below; each has a \`.sha256\` beside it."
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "This is a pre-release: \`brew install tey\` and a bare \`tey kex install\`"
              echo "stay on the current stable, and reaching this one is deliberate."
            fi
            echo
          } > release-notes.md

          # GitHub's own notes go last: they list the pull requests and new
          # contributors, which the commit log above does not.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" \
            ${previous:+-f previous_tag_name="$previous"} \
            --jq .body >> release-notes.md

          cat release-notes.md

      # The tag is created HERE, by `--target`, and this is the last thing that
      # can fail. Everything the release claims — the suites, the archives, the
      # images — is already true by the time the tag exists, so a tag in this
      # repository always names a version that was actually published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="${{ needs.version.outputs.tag }}"
          sha="${{ needs.version.outputs.sha }}"

          flags=(--target "$sha" --title "Kex ${version}" --notes-file release-notes.md)
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi

          # Re-runnable: a release that already exists gets its assets and its
          # notes replaced rather than failing the job.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" artifacts/*/* --clobber
          else
            gh release create "$tag" "${flags[@]}" artifacts/*/*
          fi

  # The npm channel: publishes the package `wasm` built, with VERSION as its
  # version number. After `publish`, so the number exists as a released Kex
  # before it exists on npm — the tag is what makes it real.
  #
  # The dist-tag mirrors the image channels exactly: stable moves `latest`,
  # a pre-release gets its channel name (`rc`, `beta`). CI's `next` tag floats
  # over dev builds and is never touched here.
  #
  # Unlike every other job, this one is NOT idempotent-by-replacement: npm
  # versions are immutable, so a re-run can only skip — the first publish of a
  # version is the one that sticks.
  npm:
    needs: [version, wasm, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package

      - name: Publish @kexhq/kex
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"

          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          else
            tag=latest
          fi

          # GitHub Packages requires auth to read too, before the existence
          # check below can ask it anything. The scoped registry line is what
          # keeps `npm view` on GitHub Packages as well: `publish` gets there
          # via the package's publishConfig, but `view` ignores it and would
          # otherwise 404 against registry.npmjs.org.
          echo "@kexhq:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

          # npm versions are immutable, so a re-run skips rather than fails.
          if npm view "@kexhq/kex@${version}" version >/dev/null 2>&1; then
            echo "@kexhq/kex@${version} is already published; npm versions cannot be replaced."
            exit 0
          fi

          npm publish "kexhq-kex-${version}.tgz" --tag "$tag"
          npm view "@kexhq/kex@${tag}" version

  # Homebrew is the stable line only. A pre-release must never become what
  # `brew install tey` hands someone, so this job simply does not run for one;
  # `tey kex install` is the channel-aware way in.
  formula:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # Where HOMEBREW_TAP_TOKEN lives: an environment secret is reachable only
    # from a job that names the environment, so nothing else in the repository
    # can push to the tap.
    environment: release
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: kexhq/homebrew-tey
          # A cross-repository push needs a token of its own; the job's default
          # GITHUB_TOKEN is scoped to kexhq/kex.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The tap is the working tree here, so this brings in the one thing from
      # kex that the job needs: tools/bump_formula.rb, which CI has already run
      # against the previous release on every pull request.
      - name: Check out the bump script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: kex-src
          sparse-checkout: tools/bump_formula.rb
          sparse-checkout-cone-mode: false

      - name: Point the formula at the new release
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/kexhq/kex/releases/download/${TAG}"

          # Four archives: Tey itself, plus one Kex per supported platform so a
          # keg can carry the compiler for the machine installing it (Intel
          # macOS publishes no archive — see the build matrix). The checksums
          # are the ones published beside them, not ones computed here — if a
          # release asset and its .sha256 ever disagreed, this would be the
          # wrong place to find out.
          for name in "tey-${VERSION}" \
                      "kex-${VERSION}-macos-arm64" \
                      "kex-${VERSION}-linux-arm64" "kex-${VERSION}-linux-x86_64"; do
            curl -fsSL "${base}/${name}.tar.gz.sha256" -o "${name}.sha256"
            cut -d' ' -f1 < "${name}.sha256" > "${name}.hash"
          done

          # The rewrite lives in kex's tools/bump_formula.rb, not in a heredoc
          # here: a script embedded in YAML cannot be syntax-checked or run
          # outside a release, which is how an indentation error once reached
          # this job and broke it on the first stable release. CI runs that
          # script against the previous release on every pull request.
          ruby kex-src/tools/bump_formula.rb "$base" "$VERSION" Formula/tey.rb .

          rm -f ./*.sha256 ./*.hash
          git diff --stat

      - name: Open the formula bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Re-running a release that changed nothing must not fail the job.
          if git diff --quiet; then
            echo "Formula already points at ${VERSION}"
            exit 0
          fi

          branch="tey-${VERSION}"
          git config user.name "kex release"
          git config user.email "noreply@kex.run"
          git checkout -b "$branch"
          git commit -am "tey ${VERSION}"

          # --force-with-lease compares against the remote-tracking ref, and
          # actions/checkout fetches only the default branch — so on a re-run,
          # where the remote already HAS this branch, there is no
          # origin/tey-<version> to compare with and git refuses the push as
          # "stale info" rather than as a conflict. Fetching the branch first
          # gives the lease the base it wants; it stays a lease rather than a
          # bare --force, so a push still aborts if somebody edited the branch
          # between this fetch and this push. `|| true` because a first release
          # has nothing to fetch, and there the lease is trivially satisfied.
          git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push -u --force-with-lease origin "$branch"

          # A re-run updates the open pull request rather than opening a second.
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Updated the open pull request for ${VERSION}"
          else
            gh pr create --head "$branch" \
              --title "tey ${VERSION}" \
              --body "Kex ${VERSION} is published. This points the formula at its tey-${VERSION}.tar.gz.

          Opened by kexhq/kex's release workflow; see docs/releasing.md there."
          fi

          # Nobody should have to click to finish a release. The formula bump
          # is mechanical — every byte of it derives from checksums already
          # published beside the release — so unlike the VERSION bump below it
          # is not a decision anyone reviews. Auto-merge rather than a direct
          # push to main so the tap's own CI (`brew style`/`audit`/`install`)
          # still stands between a bad rewrite and everyone's `brew install`;
          # the merge waits for those required checks and never happens if the
          # generated formula does not build.
          #
          # Not fatal on failure: auto-merge needs `allow_auto_merge` on the
          # tap AND at least one required status check on `main` (with neither,
          # GitHub merges immediately, which would defeat the gate). If that
          # configuration ever lapses, the release itself is still good and the
          # pull request is still open to merge by hand.
          gh pr merge "$branch" --auto --squash || {
            echo "::warning::Could not enable auto-merge for ${branch}."
            echo "::warning::Merge kexhq/homebrew-tey#${branch} by hand, then check"
            echo "::warning::allow_auto_merge and main's required status checks on the tap."
          }

  # VERSION names the NEXT release, so publishing one leaves the tree naming a
  # version that is already out. This proposes the next number as a pull
  # request rather than committing it: the bump is a decision, and a
  # release-time guess at it should be reviewable and editable — a version that
  # deserves a minor or a channel change is exactly the case a default gets
  # wrong.
  #
  # Requires "Allow GitHub Actions to create and approve pull requests" in the
  # repository's Actions settings.
  bump:
    needs: [version, publish]
    if: inputs.bump_after == 'pull request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Open the version bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # The smallest step that cannot collide with what was just released:
          # a stable gets the next patch, a pre-release the next number in its
          # own channel. Anything larger is a judgement, which is why this is a
          # PR and not a push.
          case "$RELEASED" in
            *-*)
              channel="${RELEASED#*-}"
              base="${RELEASED%%-*}"
              number="${channel#*.}"
              # `-beta` with no counter is `-beta.1` by convention, so the
              # next one is .2. Written as an `if` because a bare `[ … ] && …`
              # that tests false ends a `set -e` script.
              if [ "$number" = "$channel" ]; then number=1; fi
              next="${base}-${channel%%.*}.$((number + 1))"
              ;;
            *)
              patch="${RELEASED##*.}"
              next="${RELEASED%.*}.$((patch + 1))"
              ;;
          esac

          # Someone may have bumped it already while the release ran.
          if [ "$(tr -d "[:space:]" < VERSION)" != "$RELEASED" ]; then
            echo "VERSION already moved past ${RELEASED}; nothing to propose"
            exit 0
          fi

          branch="bump/v${next}"
          echo "$next" > VERSION
          git config user.name "kex release"
          git config user.email "noreply@kex.run"
          git checkout -b "$branch"
          git commit -am "Next version: ${next}"
          git push -u origin "$branch"

          gh pr create --base "${{ inputs.ref }}" --head "$branch" \
            --title "Next version: ${next}" \
            --body "Kex ${RELEASED} is released, so VERSION now names a version that is already out.

          This proposes ${next} as the next one. Change it here if the next release should be a minor, a major, or a different channel — VERSION always names the NEXT release, and this PR is where that decision is recorded.

          See docs/releasing.md."
