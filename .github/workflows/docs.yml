name: Docs

# Generates the reference half of docs.kex.run and hands it to the site.
#
# The site — landing page, guide, navigation, theme — is authored with
# Marqraft in kexhq/docs, which builds and publishes it. What only this repo
# can produce is the reference: `tey docs` parses sources with the compiler
# built by this very workflow, and old releases are built from git worktrees
# only this repo has. So this workflow generates it (docgen's fragments
# output, one <package>/<version>/ per unit), force-pushes it to the
# `reference` branch of kexhq/docs — a branch that holds nothing else, like
# gh-pages — and asks kexhq/docs to rebuild.
#
# A tag push means a new release and a full rebuild of every version (old
# tags parse through the CURRENT docgen). A main push only changes the
# unreleased reference, so that build skips the tag worktrees.
# `workflow_dispatch` rebuilds everything by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    # A normal run takes minutes; a stuck one used to hold the runner for
    # GitHub's six-hour limit before anyone saw it.
    timeout-minutes: 60
    steps:
      # Full history and tags: build-docs.sh adds a worktree per release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same toolchain CI uses for the compiler + Tey jobs: erlang for erlc
      # (Tey compiles to .beam and runs on the BEAM, which is how it serves
      # and how `tey docs build` runs at all).
      # Kex needs OTP 27+ (CMakeLists refuses older); ubuntu-latest's
      # erlang-base is OTP 25. On 25, JSON.parse had silently fallen back to
      # the Kex parser, and the Tey reference's --link-model read of the
      # stdlib's 1 MB model.json ran for hours instead of a second.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libpcre2-dev libreadline-dev \
            libssl-dev libboost-context-dev

      - name: Build kex
        run: cmake -B build -G "Unix Makefiles" -DKEX_BOOST_STATIC=ON && cmake --build build --parallel

      - name: Build Tey
        run: make build-tey

      # The previous hand-over, so a tag build that no longer parses keeps
      # that version's pages instead of dropping them (build-docs.sh only
      # warns for old tags). An empty branch on the first run is fine.
      - name: Check out the current reference
        uses: actions/checkout@v4
        with:
          repository: kexhq/docs
          ref: reference
          path: reference-out
        continue-on-error: true

      - name: Generate reference
        run: |
          mkdir -p reference-out
          rm -rf reference-out/.git
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tools/build-docs.sh reference-out
          else
            SKIP_TAGS=1 tools/build-docs.sh reference-out
          fi

      # Requires the DOCS_PUBLISH_TOKEN secret: a fine-grained PAT with
      # Contents: read+write on kexhq/docs (the same permission covers the
      # repository_dispatch below).
      - name: Hand over to kexhq/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          external_repository: kexhq/docs
          publish_branch: reference
          publish_dir: reference-out
          force_orphan: true
          enable_jekyll: true
          commit_message: "reference: ${{ github.ref_name }} kexhq/kex@${{ github.sha }}"

      - name: Ask kexhq/docs to rebuild
        env:
          GH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          gh api repos/kexhq/docs/dispatches \
            -f event_type=reference-updated \
            -F "client_payload[ref]=${{ github.ref_name }}" \
            -F "client_payload[sha]=${{ github.sha }}"
