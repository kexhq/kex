name: Formula bump

# The formula bump is the one release step that cannot be rehearsed by
# releasing: it runs only for a STABLE version (`prerelease == 'false'`),
# against a tap this repository does not contain. It therefore stayed
# unexecuted through every pre-release of 0.1 and 0.2 and then failed on the
# first real one, twice over — a bad tap token, and an indentation error in a
# script that lived in a YAML heredoc where nothing could parse it.
#
# So: run the real script against the LAST published release and check what
# comes out, on any pull request that touches the bump. A break surfaces on the
# pull request that causes it rather than halfway through a release that cannot
# be re-run (re-runs replay the workflow file from the original commit, and a
# fresh dispatch is refused for a version whose tag already exists).
#
# Its own workflow rather than a job in ci.yml because `paths` filters are
# workflow-level in Actions: expressing "only when the bump changed" inside CI
# would mean gating every job on it, or hand-rolling a diff check.
#
# NOT covered, because only a release can prove it: that HOMEBREW_TAP_TOKEN is
# valid, and that auto-merge is configured on the tap. Both fail loudly and
# leave the published release intact — the tap simply does not move.

on:
  pull_request:
    paths:
      - "tools/bump_formula.rb"
      - ".github/workflows/release.yml"
      - ".github/workflows/formula-bump.yml"
  # Rehearse on demand — worth doing before dispatching a release.
  workflow_dispatch:

jobs:
  rehearse:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: kexhq/homebrew-tey
          path: tap

      # For `brew style` below. Pinned rather than @master, which Homebrew has
      # deprecated and will stop syncing.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Rewrite the tap formula for the latest release
        id: rehearse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo kexhq/kex --exclude-drafts --exclude-pre-releases \
                  --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$tag" ]; then
            echo "No stable release published yet; nothing to rehearse against."
            exit 0
          fi
          version="${tag#v}"
          # Handed to the next step so it can assert the rewrite names THIS
          # release, rather than only that it produced four of something.
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Rehearsing the bump for ${tag}"

          # Tey's version is its own and is NOT derivable from the tag, so the
          # asset list is what says which tey-*.tar.gz that release published.
          # Asking the release rather than reconstructing the name also means
          # this keeps rehearsing across a change to the naming itself — which
          # is exactly what the move off `tey-<kex-version>` was.
          tey_version=$(gh release view "$tag" --repo kexhq/kex --json assets \
            --jq '[.assets[].name | capture("^tey-(?<v>.+)\\.tar\\.gz$").v] | first // empty')
          if [ -z "$tey_version" ]; then
            echo "::error::${tag} published no tey-*.tar.gz to rehearse against"
            exit 1
          fi
          echo "Tey ${tey_version} ships with Kex ${version}"

          base="https://github.com/kexhq/kex/releases/download/${tag}"
          for name in "tey-${tey_version}" \
                      "kex-${version}-macos-arm64" \
                      "kex-${version}-linux-arm64" "kex-${version}-linux-x86_64"; do
            curl -fsSL "${base}/${name}.tar.gz.sha256" | cut -d' ' -f1 > "tap/${name}.hash"
          done

          ruby tools/bump_formula.rb "$base" "$version" "$tey_version" tap/Formula/tey.rb tap
          rm -f tap/*.hash

      - name: Check what it produced
        if: steps.rehearse.outputs.tag != ''
        env:
          TAG: ${{ steps.rehearse.outputs.tag }}
        run: |
          set -euo pipefail
          cd tap

          # A no-op used to be treated as "the markers stopped matching and the
          # rewrite silently did nothing". That was wrong, and it made this job
          # fail on every pull request from the moment a release finished: the
          # rehearsal rewrites for the LATEST release, so once the tap has been
          # bumped to that release — the normal, healthy state — the correct
          # output is byte-identical to what is already there. The check only
          # ever passed because the tap happened to be stale.
          #
          # Nothing is lost by dropping it. The failure it was guarding against
          # is caught closer to home and harder: bump_formula.rb ABORTS unless
          # each marker pair matches exactly once, so a broken marker fails the
          # previous step, and the assertions below check the rewritten file
          # names this exact release rather than merely differing from before.
          if git diff --quiet; then
            echo "Formula already points at the latest release; verifying it is correct."
          fi

          # Brew evaluates this file as Ruby, so one that does not parse is a
          # broken `brew install` for everyone.
          ruby -c Formula/tey.rb

          # Parsing is not enough: `brew style` is a REQUIRED check on the tap,
          # so a generated formula that offends a cop cannot auto-merge, and
          # the release ends with an open pull request nobody was told about.
          # That is how 0.3.1 ended — FormulaAudit/ComponentsOrder objected to
          # a `resource` per platform block. The generator's output has to pass
          # the same lint the tap runs, and this is where that gets found out.
          brew style Formula/tey.rb

          # One url+sha256 for tey, three for the per-platform kex resources —
          # and all four must name the release just rehearsed. Counting alone
          # would pass a formula still pointing at the PREVIOUS version, which
          # is precisely what a silently-failed rewrite leaves behind.
          urls=$(grep -c "^ *url \"https://github.com/kexhq/kex/releases/download/${TAG}/" Formula/tey.rb)
          hashes=$(grep -cE '^ *sha256 "[0-9a-f]{64}"$' Formula/tey.rb)
          [ "$urls" = "4" ] || { echo "::error::expected 4 ${TAG} release urls, found $urls"; exit 1; }
          [ "$hashes" = "4" ] || { echo "::error::expected 4 sha256 lines, found $hashes"; exit 1; }

          # The keg version is stated rather than inferred, because the tey
          # archive is named for TEY's version now and brew would otherwise
          # read the keg version off that url — leaving `brew upgrade` blind to
          # a release that bumped only Kex. Losing this line does not break the
          # formula in any way `ruby -c` or `brew style` can see; it silently
          # strands everyone on the brew channel on an old compiler.
          if ! grep -qx "  version \"${TAG#v}\"" Formula/tey.rb; then
            echo "::error::Formula/tey.rb is missing 'version \"${TAG#v}\"' — brew would take the keg version from the tey archive's name"
            exit 1
          fi

          git diff --stat
