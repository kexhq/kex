# A three-node Kex cluster: store_node.kex and two copies of client_node.kex,
# each in a container of its own, talking over distributed Erlang.
#
#   cd examples/cluster
#   docker compose up --build
#
# The first build compiles Kex from this checkout, and runs its spec suites the
# way the published image does, so it takes a while. After that, `docker compose
# up` starts the cluster in seconds. The programs are mounted, not copied: edit
# them and run `up` again.
#
# Each client connects to the store by its node name, `store@store`, writes a
# key named after itself and lists the keys. Then it keeps chattering: every
# two seconds it posts a numbered message under its own name, and prints what
# every other client last posted, so the output shows the nodes exchanging
# messages until you stop them (Ctrl-C, or `docker compose down`):
#
#   client-b-1  | round 5: client@client-a said "message 5"
#   client-a-1  | round 6: client@client-b said "message 5"
#
# Clients leave the store running (KEX_STOP_STORE=false), so more can join
# while the cluster is up. Each needs a hostname of its own, since that is part
# of its node name, so a new one is started beside the services rather than as
# another copy of one:
#
#   docker run --rm -it --network cluster_cluster --hostname client-c \
#     -v "$PWD:/work:ro" -e KEX_STORE_NODE=store@store -e KEX_STOP_STORE=false \
#     -e KEX_ROUNDS=0 kex-cluster-example \
#     --sname client --cookie kex-cluster-demo client_node.kex
#
# A node's name is `<sname>@<container hostname>`. That is why every service
# sets `hostname:`; Compose's DNS resolves each hostname to its container.

x-kex-node: &kex-node
  image: kex-cluster-example
  # Built here, from this checkout, by the store service; never on a registry.
  # Without this Compose first tries to pull it, and prints "pull access denied".
  # A missing image is still built — `never` only rules out the registry.
  pull_policy: never
  volumes:
    - ./:/work:ro
  networks:
    - cluster
  environment: &kex-environment
    KEX_STORE_NODE: store@store
    KEX_STOP_STORE: "false"
    # Keep chattering until `docker compose down` (or Ctrl-C): a message every
    # two seconds from each client, and a line for each message it sees.
    KEX_ROUNDS: "0"
    KEX_INTERVAL: "2000"

services:
  store:
    <<: *kex-node
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    hostname: store
    command: ["--sname", "store", "--cookie", "${KEX_COOKIE:-kex-cluster-demo}", "store_node.kex"]

  client-a:
    <<: *kex-node
    hostname: client-a
    depends_on: [store]
    command: ["--sname", "client", "--cookie", "${KEX_COOKIE:-kex-cluster-demo}", "client_node.kex"]

  client-b:
    <<: *kex-node
    hostname: client-b
    depends_on: [client-a]
    command: ["--sname", "client", "--cookie", "${KEX_COOKIE:-kex-cluster-demo}", "client_node.kex"]

networks:
  cluster:
